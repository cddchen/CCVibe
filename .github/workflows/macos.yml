name: macOS

on:
  push:
    branches:
      - main
    tags:
      - "mac-v*"
    paths:
      - "repos/cc-agent-mac/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "repos/cc-agent-mac/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      signing-enabled: ${{ steps.signing-state.outputs.enabled }}
    defaults:
      run:
        working-directory: repos/cc-agent-mac
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve build version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#mac-v}"
          else
            version_name="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "CCLINK_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "CCLINK_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Detect release signing configuration
        id: signing-state
        shell: bash
        run: |
          required_names=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            APPLE_TEAM_ID
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_API_PRIVATE_KEY_BASE64
          )
          configured=0
          for name in "${required_names[@]}"; do
            if [[ -n "${!name}" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -ne 0 && "$configured" -ne "${#required_names[@]}" ]]; then
            echo "macOS signing secrets must either all be configured or all be absent." >&2
            exit 1
          fi

          if [[ "$configured" -eq "${#required_names[@]}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "Apple signing secrets are absent; publishing an unsigned prerelease ZIP."
            fi
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CCAgent.xcodeproj -scheme CCAgent

      - name: Run macOS tests
        run: |
          xcodebuild \
            -project CCAgent.xcodeproj \
            -scheme CCAgent \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned CI package
        if: github.ref_type != 'tag' || steps.signing-state.outputs.enabled != 'true'
        shell: bash
        run: |
          xcodebuild \
            -project CCAgent.xcodeproj \
            -scheme CCAgent \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$CCLINK_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$CCLINK_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/CCAgent.app \
            "build/artifacts/CCAgent-${CCLINK_VERSION_NAME}-macOS-unsigned.zip"

      - name: Import Developer ID certificate
        if: github.ref_type == 'tag' && steps.signing-state.outputs.enabled == 'true'
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/cclink-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          echo "CCLINK_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Archive signed macOS app
        if: github.ref_type == 'tag' && steps.signing-state.outputs.enabled == 'true'
        shell: bash
        run: |
          xcodebuild \
            -project CCAgent.xcodeproj \
            -scheme CCAgent \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/CCAgent.xcarchive \
            MARKETING_VERSION="$CCLINK_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$CCLINK_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            archive

          codesign --verify --deep --strict --verbose=2 \
            build/CCAgent.xcarchive/Products/Applications/CCAgent.app

      - name: Notarize and package macOS app
        if: github.ref_type == 'tag' && steps.signing-state.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p build/artifacts "$RUNNER_TEMP/notary"
          api_key_path="$RUNNER_TEMP/notary/AuthKey_${APPLE_API_KEY_ID}.p8"
          app_path="build/CCAgent.xcarchive/Products/Applications/CCAgent.app"
          submission_zip="$RUNNER_TEMP/CCAgent-notary.zip"
          release_zip="build/artifacts/CCAgent-${CCLINK_VERSION_NAME}-macOS.zip"
          release_dmg="build/artifacts/CCAgent-${CCLINK_VERSION_NAME}-macOS.dmg"

          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | openssl base64 -d -A > "$api_key_path"
          chmod 600 "$api_key_path"

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$submission_zip"
          xcrun notarytool submit "$submission_zip" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$release_zip"

          dmg_root="$RUNNER_TEMP/cclink-dmg"
          mkdir -p "$dmg_root"
          ditto "$app_path" "$dmg_root/CCAgent.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "CCAgent" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "$release_dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$release_dmg"
          xcrun notarytool submit "$release_dmg" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$release_dmg"
          xcrun stapler validate "$release_dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cclink-macos-${{ env.CCLINK_VERSION_NAME }}
          path: repos/cc-agent-mac/build/artifacts/*
          if-no-files-found: error

      - name: Delete temporary keychain
        if: always() && env.CCLINK_KEYCHAIN_PATH != ''
        shell: bash
        run: security delete-keychain "$CCLINK_KEYCHAIN_PATH" || true

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cclink-macos-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNING_ENABLED: ${{ needs.build.outputs.signing-enabled }}
        run: |
          version_name="${GITHUB_REF_NAME#mac-v}"
          release_files=(release-artifacts/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" --clobber
            if [[ "$SIGNING_ENABLED" != "true" ]]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease
            fi
          elif [[ "$SIGNING_ENABLED" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --generate-notes \
              --title "CCAgent macOS ${version_name}"
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --prerelease \
              --notes "Unsigned macOS preview build. This ZIP is not Developer ID signed or notarized and is intended for internal testing." \
              --title "CCAgent macOS ${version_name}"
          fi
